name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (analyzers + dev extras)
        run: pip install -e ".[analyzers,dev]"

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check .

      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Smoke-test built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/gatekeeper-wheel
          /tmp/gatekeeper-wheel/bin/pip install dist/*.whl
          /tmp/gatekeeper-wheel/bin/gatekeeper version

      - name: Run trust-drift benchmark corpus
        run: python -m gatekeeper_cli.benchmarks.run

      - name: Dogfood — Gatekeeper scans itself
        run: gatekeeper scan .

      - name: Generate SARIF report
        if: always()
        # Re-running the scan only to emit results.sarif for upload; the
        # pass/fail verdict was already enforced by the "Dogfood" step above,
        # so a nonzero exit here (same findings, different format) must not
        # separately fail the job.
        continue-on-error: true
        run: gatekeeper scan . --format sarif --output results.sarif

      - name: Upload SARIF to code scanning
        if: always() && matrix.python-version == '3.12'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
