[project]
name = "gatekeeper-trust-drift"
version = "0.1.0"
description = "Detect security-relevant dependency trust drift before merge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nadav" }]
keywords = ["supply-chain-security", "dependency-security", "trust-drift", "devsecops", "npm", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
gatekeeper = "gatekeeper_cli.main:app"

[project.optional-dependencies]
analyzers = ["ruff>=0.4", "bandit>=1.7"]
dev = ["pytest>=8.0", "build>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gatekeeper_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep CI behavior stable across Ruff releases; expand deliberately, not implicitly.
select = ["E4", "E7", "E9", "F"]

[project.urls]
Homepage = "https://github.com/nalkaslassy/gatekeeper"
Repository = "https://github.com/nalkaslassy/gatekeeper"
Issues = "https://github.com/nalkaslassy/gatekeeper/issues"
