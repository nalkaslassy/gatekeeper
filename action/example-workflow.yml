# .github/workflows/gatekeeper.yml — minimal dependency trust review.
name: Gatekeeper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gatekeeper
        run: pip install "gatekeeper-cli[analyzers]"

      - name: Review dependency trust drift
        run: gatekeeper review .

      # Optional: use this instead when registry-backed package-content
      # comparison is desired. It makes outbound HTTPS requests to npm.
      #
      # - name: Review dependency trust + npm content drift
      #   run: gatekeeper review . --online-content
