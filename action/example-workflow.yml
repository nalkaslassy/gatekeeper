# .github/workflows/gatekeeper.yml
name: Dependency Trust Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Commit .gatekeeper-trust.json first:
      #   gatekeeper trust snapshot .
      - name: Review dependency trust drift
        uses: nalkaslassy/gatekeeper@v0.1.0
        with:
          version: "0.1.0"
          # Set true only when you want npm registry-backed content comparison.
          online-content: "false"
